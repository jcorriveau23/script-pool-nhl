[project]
name = "nhl_helper"
version = "0.1.0"
description = "helper to fetch nhl api results and store it in database"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "lxml>=6.0.1",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.14.2",
    "pymongo>=4.14.1",
    "requests>=2.32.5",
]

[project.scripts]
nhl-daily-leaders = "nhl_helper.nhl.get_daily_points_leaders:main"
nhl-injuries = "nhl_helper.nhl.get_injury:main"
nhl-active-players = "nhl_helper.nhl.get_active_players:main"
nhl-contracts = "nhl_helper.nhl.get_active_contract_info:main"
nhl-cumulate-stats = "nhl_helper.nhl.cumulate_active_players_stats:main"
nhl-update-pool-players = "nhl_helper.pool.update_pool_players_info:main"

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "mypy>=1.17.1",
    "pytest>=9.1.1",
    "ruff>=0.12.10",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nhl_helper"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is not enforced: the existing code has many long f-string log
# messages and reflowing them all would bury real changes in noise.
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
packages = ["nhl_helper"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
