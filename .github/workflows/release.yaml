name: Release

on:
  release:
    types: [published]

jobs:
  # Each architecture builds on a runner of its own architecture rather than
  # emulating arm64 with QEMU. uv resolves the lockfile per-platform and any
  # dependency without an aarch64 wheel is compiled from source, which is what
  # makes the emulated build slow enough to be worth avoiding.
  #
  # arm64 is what the production host needs (Ampere A1). amd64 is kept so the
  # stack can still move back to an x86 host without touching CI.
  build:
    name: Build and Push Docker Image
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Prepare platform slug
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are applied by the merge job, not here. This is only for labels.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      # push-by-digest: each architecture is pushed as an unnamed manifest.
      # Neither is usable on its own; the merge job ties them together under
      # the real tags.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per platform. Sharing one scope makes the two legs evict
          # each other's uv layers on every run.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Collects the per-architecture digests into one multi-arch manifest list and
  # publishes it under the release tags. `latest` only moves here, so a failed
  # architecture leaves the previous image in place rather than half-updating.
  merge:
    name: Merge manifests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:latest

  deploy:
    name: Deploy to server
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job's own GITHUB_TOKEN pull the image it just pushed.
      packages: read
    steps:
      - name: Pull the new image
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The registry login is a no-op while the package is public, and is
          # what keeps this working the day it is made private — no change on
          # the server. The token is scoped to this run and expires with it.
          #
          # Nothing is restarted: there is no long-running service any more. The
          # systemd timers create a container per run, so the next firing of each
          # timer picks up the image pulled here on its own.
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd /srv/slapshot
            docker compose pull scraper
            docker image prune -f
